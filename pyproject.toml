[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-evaluation-batch-inference-platform"
version = "0.1.0"
description = "FastAPI service for batch NLP model evaluation, metric storage, and release regression gates."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "tenacity>=8.5.0,<10.0.0",
  "python-json-logger>=2.0.7,<4.0.0",
  "torch>=2.4.0,<3.0.0",
  "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
ml-eval-platform = "ml_eval_platform.cli:main"

[tool.setuptools.packages.find]
include = ["ml_eval_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
