services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ml_eval
      POSTGRES_PASSWORD: ml_eval
      POSTGRES_DB: ml_eval
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_eval -d ml_eval"]
      interval: 5s
      timeout: 5s
      retries: 8
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: docker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://ml_eval:ml_eval@postgres:5432/ml_eval
      AUTO_CREATE_TABLES: "true"
      STORE_PREDICTIONS: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://ml_eval:ml_eval@postgres:5432/ml_eval
      AUTO_CREATE_TABLES: "false"
      STORE_PREDICTIONS: "false"
    command: sh -c "python -m ml_eval_platform.cli init-db && pytest"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres-data:

